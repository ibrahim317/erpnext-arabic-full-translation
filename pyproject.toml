[project]
name = "arabic_translations"
authors = [
    { name = "ibrahim317", email = "i.aboelsoud21@gmail.com"}
]
description = "Arabic Translations for Frappe, ERPNext, HR and CRM"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe versions this app supports. bench and Frappe Cloud read this to decide
# whether the app can be installed on a given bench; without it, installation
# fails with "Could not find compatible Frappe version in pyproject.toml".
# The app ships both v15 and v16 bundles and picks the newest bundle <= the
# running major version, so it supports 15.x and 16.x.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0-dev,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "RUF001", # Arabic text is not "ambiguous unicode"
    "RUF002",
    "RUF003",
    "RUF005", # list concat style nit in build tooling
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
